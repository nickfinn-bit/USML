<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0f">
    <title>Triage | Speed USMLE by USMLE300</title>
    <meta name="description" content="60 seconds. How many can you diagnose? A speed-based USMLE pattern recognition game.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-2: #1c1c28;
            --surface-3: #262635;
            --border: rgba(255,255,255,0.06);
            --accent: #00e5a0;
            --accent-dim: rgba(0,229,160,0.15);
            --accent-glow: rgba(0,229,160,0.3);
            --hot: #ff3d5a;
            --hot-dim: rgba(255,61,90,0.15);
            --hot-glow: rgba(255,61,90,0.3);
            --warn: #ffaa00;
            --warn-dim: rgba(255,170,0,0.15);
            --gold: #f0c040;
            --burgundy: #722F37;
            --text: #eae8f4;
            --text-dim: #7d7b8e;
            --text-faint: #48475a;
            --radius: 14px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; overflow:hidden; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex; flex-direction: column;
        }

        /* ─── AMBIENT GRID ─── */
        body::after {
            content:'';
            position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ─── SCREENS ─── */
        .screen { display:none; flex-direction:column; height:100%; position:relative; z-index:1; }
        .screen.active { display:flex; }

        /* ═══════════════ TITLE SCREEN ═══════════════ */
        .title-screen {
            align-items:center; justify-content:center;
            text-align:center; padding:24px;
            background: radial-gradient(ellipse at 50% 30%, rgba(0,229,160,0.06) 0%, transparent 60%);
        }
        .title-icon {
            font-size: 4rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 30px var(--accent-glow));
        }
        .title-logo {
            font-family: 'Anybody', sans-serif;
            font-weight: 900; font-size: 3rem;
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, var(--accent), #00ffb3);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
            line-height:1.1;
        }
        .title-sub {
            font-size: 1rem; color:var(--text-dim);
            margin: 8px 0 32px; max-width:360px; line-height:1.6;
        }
        .title-rules {
            display:flex; gap:12px; margin-bottom:32px; flex-wrap:wrap; justify-content:center;
        }
        .title-rule {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:10px;
            padding:10px 16px;
            font-size:0.82rem;
            display:flex; align-items:center; gap:8px;
            color:var(--text);
        }
        .title-rule .emoji { font-size:1.2rem; }
        .title-rule strong { color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.85rem; }
        .title-rule.penalty strong { color:var(--hot); }

        .mode-select {
            display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;
        }
        .mode-btn {
            padding:10px 20px;
            border-radius:10px;
            border:2px solid var(--border);
            background:var(--surface);
            color:var(--text-dim);
            font-family:'DM Sans',sans-serif;
            font-weight:600; font-size:0.85rem;
            cursor:pointer; transition:all 0.2s;
        }
        .mode-btn.selected {
            border-color:var(--accent);
            background:var(--accent-dim);
            color:var(--accent);
        }
        .mode-btn:hover { border-color:rgba(255,255,255,0.15); }

        .start-btn {
            padding:18px 60px;
            border-radius:14px;
            border:none;
            background:linear-gradient(135deg, var(--accent), #00ffb3);
            color:#0a0a0f;
            font-family:'Anybody',sans-serif;
            font-weight:900; font-size:1.15rem;
            letter-spacing:0.04em;
            cursor:pointer; transition:all 0.2s;
        }
        .start-btn:hover { transform:translateY(-3px); box-shadow:0 10px 40px var(--accent-glow); }
        .start-btn:active { transform:translateY(0); }

        .high-score-display {
            margin-top:20px;
            font-family:'JetBrains Mono',monospace;
            font-size:0.8rem;
            color:var(--text-faint);
        }
        .high-score-display strong { color:var(--gold); }

        /* ═══════════════ GAME SCREEN ═══════════════ */
        .game-screen { padding:0; }

        /* ─ HUD ─ */
        .hud {
            display:flex; justify-content:space-between; align-items:center;
            padding:12px 18px;
            background:var(--surface);
            border-bottom:1px solid var(--border);
            flex-shrink:0;
        }
        .hud-left, .hud-right { display:flex; align-items:center; gap:14px; }
        .hud-stat {
            display:flex; flex-direction:column; align-items:center; gap:1px;
        }
        .hud-stat-label {
            font-family:'JetBrains Mono',monospace;
            font-size:0.55rem; font-weight:700;
            text-transform:uppercase; letter-spacing:0.15em;
            color:var(--text-faint);
        }
        .hud-stat-value {
            font-family:'JetBrains Mono',monospace;
            font-size:1.3rem; font-weight:800;
        }
        .hud-stat-value.score-val { color:var(--accent); }
        .hud-stat-value.streak-val { color:var(--gold); }

        /* ─ TIMER BAR ─ */
        .timer-bar-wrap {
            height:5px; background:var(--surface-2);
            flex-shrink:0; overflow:hidden;
        }
        .timer-bar {
            height:100%;
            background:linear-gradient(90deg, var(--accent), #00ffb3);
            transition: width 0.1s linear;
            border-radius: 0 3px 3px 0;
        }
        .timer-bar.warn { background:linear-gradient(90deg, var(--warn), #ffcc00); }
        .timer-bar.danger { background:linear-gradient(90deg, var(--hot), #ff6680); animation: timerPulse 0.5s ease infinite; }
        @keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

        .timer-readout {
            text-align:center; padding:6px 0;
            font-family:'JetBrains Mono',monospace;
            font-size:0.8rem; font-weight:700;
            color:var(--text-dim);
            flex-shrink:0;
        }
        .timer-readout.warn { color:var(--warn); }
        .timer-readout.danger { color:var(--hot); }

        /* ─ VIGNETTE AREA ─ */
        .vignette-area {
            flex:1; display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            padding:20px 18px;
            overflow-y:auto;
        }
        .vignette-card {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:24px 20px;
            max-width:580px; width:100%;
            animation: cardIn 0.35s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(16px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        .vignette-step {
            font-family:'JetBrains Mono',monospace;
            font-size:0.6rem; font-weight:700;
            text-transform:uppercase; letter-spacing:0.18em;
            color:var(--accent); margin-bottom:10px;
            display:flex; align-items:center; gap:8px;
        }
        .vignette-step .q-number {
            background:var(--accent-dim);
            padding:2px 8px; border-radius:4px;
        }
        .vignette-text {
            font-size:0.92rem; line-height:1.75;
            color:var(--text); margin-bottom:6px;
        }
        .vignette-lead {
            font-size:0.88rem; line-height:1.6;
            color:var(--text-dim);
            font-weight:600;
            font-style:italic;
            border-top:1px solid var(--border);
            padding-top:12px; margin-top:12px;
        }

        /* ─ OPTIONS ─ */
        .options-grid {
            display:grid; grid-template-columns:1fr 1fr;
            gap:8px; padding:0 18px 20px;
            max-width:616px; width:100%;
            margin:0 auto;
            flex-shrink:0;
        }
        @media(max-width:480px) { .options-grid { grid-template-columns:1fr; } }
        .opt-btn {
            display:flex; align-items:center; gap:10px;
            background:var(--surface);
            border:2px solid var(--border);
            border-radius:12px;
            padding:14px 14px;
            color:var(--text);
            font-family:'DM Sans',sans-serif;
            font-size:0.85rem; font-weight:600;
            cursor:pointer; transition:all 0.15s;
            text-align:left;
        }
        .opt-btn:hover:not(:disabled) {
            border-color:rgba(255,255,255,0.15);
            background:var(--surface-2);
        }
        .opt-btn:active:not(:disabled) { transform:scale(0.97); }
        .opt-letter {
            width:26px; height:26px;
            border-radius:6px;
            background:var(--surface-2);
            display:flex; align-items:center; justify-content:center;
            font-family:'JetBrains Mono',monospace;
            font-size:0.7rem; font-weight:700;
            color:var(--text-dim); flex-shrink:0;
        }
        .opt-btn.correct {
            border-color:var(--accent); background:var(--accent-dim);
            animation: flashCorrect 0.4s ease;
        }
        .opt-btn.correct .opt-letter { background:var(--accent); color:#0a0a0f; }
        .opt-btn.wrong {
            border-color:var(--hot); background:var(--hot-dim);
            animation: flashWrong 0.4s ease;
        }
        .opt-btn.wrong .opt-letter { background:var(--hot); color:white; }
        .opt-btn:disabled { cursor:default; }
        @keyframes flashCorrect { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }
        @keyframes flashWrong { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }

        /* ─ TIME BONUS/PENALTY POPUP ─ */
        .time-popup {
            position:fixed;
            top:50%; left:50%;
            transform:translate(-50%,-50%);
            font-family:'Anybody',sans-serif;
            font-weight:900; font-size:3rem;
            pointer-events:none; z-index:50;
            animation: popUp 0.8s ease forwards;
        }
        .time-popup.bonus { color:var(--accent); text-shadow:0 0 40px var(--accent-glow); }
        .time-popup.penalty { color:var(--hot); text-shadow:0 0 40px var(--hot-glow); }
        @keyframes popUp {
            0% { opacity:1; transform:translate(-50%,-50%) scale(0.5); }
            40% { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
            100% { opacity:0; transform:translate(-50%,-60%) scale(1); }
        }

        /* ─ FEEDBACK STRIPE ─ */
        .feedback-stripe {
            position:fixed; top:0; left:0; right:0; height:4px;
            z-index:50; animation: stripeFlash 0.6s ease forwards;
        }
        .feedback-stripe.correct { background:var(--accent); }
        .feedback-stripe.wrong { background:var(--hot); }
        @keyframes stripeFlash { 0%{opacity:1} 100%{opacity:0} }

        /* ═══════════════ RESULTS SCREEN ═══════════════ */
        .results-screen {
            align-items:center; justify-content:center;
            text-align:center; padding:24px;
            background: radial-gradient(ellipse at 50% 40%, rgba(0,229,160,0.06) 0%, transparent 60%);
            overflow-y:auto;
        }
        .results-inner { max-width:440px; width:100%; }
        .results-grade {
            font-size:3.5rem; margin-bottom:4px;
        }
        .results-title {
            font-family:'Anybody',sans-serif;
            font-weight:900; font-size:1.6rem;
            margin-bottom:4px;
        }
        .results-subtitle {
            color:var(--text-dim); font-size:0.9rem;
            margin-bottom:24px;
        }
        .results-stats {
            display:flex; gap:12px; justify-content:center;
            margin-bottom:28px; flex-wrap:wrap;
        }
        .result-stat-card {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:12px;
            padding:14px 20px;
            min-width:100px;
        }
        .result-stat-val {
            font-family:'JetBrains Mono',monospace;
            font-weight:800; font-size:1.6rem;
        }
        .result-stat-val.green { color:var(--accent); }
        .result-stat-val.red { color:var(--hot); }
        .result-stat-val.gold { color:var(--gold); }
        .result-stat-label {
            font-size:0.7rem; color:var(--text-faint);
            text-transform:uppercase; letter-spacing:0.1em;
            font-weight:600; margin-top:2px;
        }
        .results-bar-chart {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:12px;
            padding:16px;
            margin-bottom:24px;
            text-align:left;
        }
        .bar-chart-title {
            font-family:'JetBrains Mono',monospace;
            font-size:0.65rem; font-weight:700;
            text-transform:uppercase; letter-spacing:0.12em;
            color:var(--text-faint); margin-bottom:12px;
        }
        .bar-row {
            display:flex; align-items:center; gap:10px;
            margin-bottom:6px;
        }
        .bar-label {
            font-size:0.75rem; color:var(--text-dim);
            width:40px; text-align:right;
            font-family:'JetBrains Mono',monospace;
            font-weight:600;
        }
        .bar-track {
            flex:1; height:8px; background:var(--surface-2);
            border-radius:4px; overflow:hidden;
        }
        .bar-fill {
            height:100%; border-radius:4px;
            transition: width 1s cubic-bezier(0.16,1,0.3,1);
        }
        .bar-fill.green { background:var(--accent); }
        .bar-fill.red { background:var(--hot); }

        .share-btn-triage {
            width:100%; padding:16px;
            border-radius:var(--radius);
            border:none;
            background:linear-gradient(135deg, var(--accent), #00ffb3);
            color:#0a0a0f;
            font-family:'Anybody',sans-serif;
            font-weight:900; font-size:1rem;
            letter-spacing:0.03em;
            cursor:pointer; transition:all 0.2s;
            margin-bottom:10px;
        }
        .share-btn-triage:hover { transform:translateY(-2px); box-shadow:0 8px 30px var(--accent-glow); }

        .retry-btn {
            width:100%; padding:14px;
            border-radius:var(--radius);
            border:1px solid var(--border);
            background:transparent;
            color:var(--text-dim);
            font-family:'DM Sans',sans-serif;
            font-weight:700; font-size:0.9rem;
            cursor:pointer; transition:all 0.2s;
            margin-bottom:10px;
        }
        .retry-btn:hover { background:var(--surface); color:var(--text); }

        .cta-card {
            background:linear-gradient(135deg, var(--burgundy), #8a3542);
            border-radius:var(--radius);
            padding:20px;
            margin-top:8px;
        }
        .cta-card-title {
            font-family:'Anybody',sans-serif;
            font-weight:800; font-size:1rem;
            margin-bottom:4px;
        }
        .cta-card-text {
            font-size:0.8rem; color:rgba(255,255,255,0.7);
            margin-bottom:12px;
        }
        .cta-card-btn {
            display:inline-flex; align-items:center; gap:6px;
            padding:10px 24px; border-radius:8px;
            border:none; background:white;
            color:var(--burgundy);
            font-family:'DM Sans',sans-serif;
            font-weight:700; font-size:0.85rem;
            cursor:pointer; text-decoration:none;
            transition:all 0.2s;
        }
        .cta-card-btn:hover { transform:translateY(-2px); }

        /* ─ COUNTDOWN OVERLAY ─ */
        .countdown-overlay {
            position:fixed; inset:0;
            background:rgba(10,10,15,0.95);
            display:flex; align-items:center; justify-content:center;
            z-index:200;
        }
        .countdown-num {
            font-family:'Anybody',sans-serif;
            font-weight:900; font-size:8rem;
            color:var(--accent);
            animation: countPop 0.8s ease;
            text-shadow: 0 0 80px var(--accent-glow);
        }
        @keyframes countPop {
            0% { transform:scale(2); opacity:0; }
            50% { transform:scale(0.9); opacity:1; }
            100% { transform:scale(1); opacity:1; }
        }
        .countdown-go {
            font-family:'Anybody',sans-serif;
            font-weight:900; font-size:4rem;
            color:var(--accent);
            animation: countPop 0.5s ease;
            text-shadow: 0 0 80px var(--accent-glow);
        }

        /* ─ UTILITY ─ */
        .hidden { display:none!important; }
    </style>
</head>
<body>

<!-- ═══ TITLE SCREEN ═══ -->
<div class="screen title-screen active" id="titleScreen">
    <div class="title-icon">⚡</div>
    <div class="title-logo">TRIAGE</div>
    <div class="title-sub">60 seconds on the clock. Diagnose as many patients as you can. How fast is your clinical pattern recognition?</div>
    <div class="title-rules">
        <div class="title-rule">
            <span class="emoji">✅</span> Correct = <strong>+3s</strong>
        </div>
        <div class="title-rule penalty">
            <span class="emoji">❌</span> Wrong = <strong>−5s</strong>
        </div>
        <div class="title-rule">
            <span class="emoji">⏭️</span> Skip = <strong>0s</strong>
        </div>
    </div>
    <div class="mode-select">
        <button class="mode-btn selected" onclick="selectMode(this,'all')">All Steps</button>
        <button class="mode-btn" onclick="selectMode(this,'Step 1')">Step 1</button>
        <button class="mode-btn" onclick="selectMode(this,'Step 2 CK')">Step 2 CK</button>
    </div>
    <button class="start-btn" onclick="beginCountdown()">START TRIAGE</button>
    <div class="high-score-display" id="highScoreDisplay"></div>
</div>

<!-- ═══ COUNTDOWN OVERLAY ═══ -->
<div class="countdown-overlay hidden" id="countdownOverlay">
    <div id="countdownContent"></div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div class="screen game-screen" id="gameScreen">
    <div class="hud">
        <div class="hud-left">
            <div class="hud-stat">
                <div class="hud-stat-label">Score</div>
                <div class="hud-stat-value score-val" id="hudScore">0</div>
            </div>
        </div>
        <div class="hud-right">
            <div class="hud-stat">
                <div class="hud-stat-label">Streak</div>
                <div class="hud-stat-value streak-val" id="hudStreak">0</div>
            </div>
            <button class="opt-btn" style="padding:8px 14px;font-size:0.75rem;border-radius:8px;" onclick="skipQuestion()">Skip →</button>
        </div>
    </div>
    <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="timer-readout" id="timerReadout">60.0s</div>
    <div class="vignette-area" id="vignetteArea"></div>
    <div class="options-grid" id="optionsGrid"></div>
</div>

<!-- ═══ RESULTS SCREEN ═══ -->
<div class="screen results-screen" id="resultsScreen">
    <div class="results-inner" id="resultsInner"></div>
</div>

<script>
// ═══ QUESTION BANK ═══
const ALL_QUESTIONS = [
  {"step":"Step 1","text":"A 24-year-old man with a history of recurrent pulmonary infections and a groin abscess presents for evaluation. Culture of the abscess grows Staphylococcus aureus. A nitroblue tetrazolium test reveals a lack of blue pigment formation in his neutrophils.","lead":"This patient is most likely deficient in which of the following enzymes?","options":["Glutathione peroxidase","Myeloperoxidase","NADPH oxidase","Superoxide dismutase"],"correct":2,"objective":"Chronic Granulomatous Disease is caused by NADPH oxidase deficiency."},
  {"step":"Step 1","text":"A 55-year-old man with chronic alcoholism presents with confusion, ophthalmoplegia, and ataxia. He is given intravenous glucose without prior vitamin supplementation, and his symptoms acutely worsen.","lead":"Deficiency of which vitamin most likely caused this patient's deterioration?","options":["Vitamin B6","Vitamin B1 (thiamine)","Vitamin B12","Vitamin B3"],"correct":1,"objective":"Wernicke encephalopathy — always give thiamine BEFORE glucose."},
  {"step":"Step 1","text":"A 32-year-old woman presents with diplopia and ptosis that worsens throughout the day. Chest CT reveals an anterior mediastinal mass. Her symptoms improve after administration of edrophonium.","lead":"Antibodies are most likely directed against which of the following?","options":["Presynaptic calcium channels","Postsynaptic acetylcholine receptors","Presynaptic ACh release sites","Muscle-specific kinase only"],"correct":1,"objective":"Myasthenia gravis — anti-AChR antibodies at the NMJ."},
  {"step":"Step 1","text":"A 67-year-old man with a 40-pack-year smoking history presents with a centrally located lung mass. Biopsy shows nests of cells with intercellular bridges and keratin pearls.","lead":"Most likely diagnosis?","options":["Adenocarcinoma","Small cell carcinoma","Squamous cell carcinoma","Large cell carcinoma"],"correct":2,"objective":"Central + keratin pearls + intercellular bridges = Squamous cell."},
  {"step":"Step 1","text":"A 19-year-old man is brought to the ED after a motorcycle accident. BP 80/50, HR 130, distended neck veins, muffled heart sounds. ECG shows low-voltage QRS.","lead":"Which hemodynamic finding is most likely?","options":["Increased cardiac output","Equalization of diastolic pressures","Decreased CVP","Increased pulse pressure"],"correct":1,"objective":"Cardiac tamponade → equalization of diastolic pressures. Beck's triad."},
  {"step":"Step 1","text":"A 4-year-old boy has progressive clumsiness and frequent falls. Exam shows calf pseudohypertrophy and a positive Gowers sign. Muscle biopsy reveals absence of dystrophin.","lead":"Inheritance pattern?","options":["Autosomal dominant","Autosomal recessive","X-linked recessive","Mitochondrial"],"correct":2,"objective":"Duchenne muscular dystrophy — X-linked recessive, dystrophin gene."},
  {"step":"Step 1","text":"A 45-year-old woman presents with episodic headaches, palpitations, and diaphoresis. BP 210/120 mmHg. CT shows a 4-cm adrenal mass. Urine metanephrines are markedly elevated.","lead":"Which medication should be administered first before surgery?","options":["Propranolol","Phenoxybenzamine","Metyrosine","Hydralazine"],"correct":1,"objective":"Pheochromocytoma — alpha-blockade BEFORE beta-blockade."},

// ═══ STATE ═══
let mode = 'all';
let questions = [];
let qIndex = 0;
let score = 0;
let correct = 0;
let wrong = 0;
let skipped = 0;
let streak = 0;
let bestStreak = 0;
let timeLeft = 60.0;
let timerInterval = null;
let gameActive = false;
let answering = false;

function selectMode(btn, m) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    mode = m;
}

// Show high score
function updateHighScoreDisplay() {
    const hs = parseInt(localStorage.getItem('triage_hs_' + mode) || '0');
    const el = document.getElementById('highScoreDisplay');
    if (hs > 0) {
        el.innerHTML = `Personal best (${mode === 'all' ? 'All' : mode}): <strong>${hs}</strong>`;
    } else {
        el.innerHTML = '';
    }
}
updateHighScoreDisplay();

// ═══ COUNTDOWN ═══
function beginCountdown() {
    updateHighScoreDisplay();
    const overlay = document.getElementById('countdownOverlay');
    const content = document.getElementById('countdownContent');
    overlay.classList.remove('hidden');
    let count = 3;
    content.innerHTML = `<div class="countdown-num">${count}</div>`;
    const intv = setInterval(() => {
        count--;
        if (count > 0) {
            content.innerHTML = `<div class="countdown-num">${count}</div>`;
        } else if (count === 0) {
            content.innerHTML = `<div class="countdown-go">GO!</div>`;
        } else {
            clearInterval(intv);
            overlay.classList.add('hidden');
            startGame();
        }
    }, 700);
}

// ═══ START GAME ═══
function startGame() {
    // Prepare questions
    let pool = mode === 'all' ? [...ALL_QUESTIONS] : ALL_QUESTIONS.filter(q => q.step === mode);
    // Shuffle
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    questions = pool;
    qIndex = 0;
    score = 0; correct = 0; wrong = 0; skipped = 0; streak = 0; bestStreak = 0;
    timeLeft = 60.0;
    gameActive = true;
    answering = false;

    document.getElementById('titleScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');

    updateHUD();
    showQuestion();
    startTimer();
}

function startTimer() {
    const bar = document.getElementById('timerBar');
    const readout = document.getElementById('timerReadout');
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
            timeLeft = 0;
            endGame();
        }
        const pct = (timeLeft / 60) * 100;
        bar.style.width = pct + '%';
        readout.textContent = timeLeft.toFixed(1) + 's';
        // Color classes
        bar.classList.remove('warn', 'danger');
        readout.classList.remove('warn', 'danger');
        if (timeLeft <= 10) {
            bar.classList.add('danger');
            readout.classList.add('danger');
        } else if (timeLeft <= 20) {
            bar.classList.add('warn');
            readout.classList.add('warn');
        }
    }, 100);
}

function endGame() {
    gameActive = false;
    clearInterval(timerInterval);
    // Save high score
    const key = 'triage_hs_' + mode;
    const prev = parseInt(localStorage.getItem(key) || '0');
    if (score > prev) localStorage.setItem(key, score.toString());
    showResults();
}

// ═══ SHOW QUESTION ═══
function showQuestion() {
    if (!gameActive) return;
    if (qIndex >= questions.length) {
        // Loop back with reshuffle
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        qIndex = 0;
    }
    const q = questions[qIndex];
    answering = false;

    document.getElementById('vignetteArea').innerHTML = `
        <div class="vignette-card">
            <div class="vignette-step">
                <span class="q-number">${q.step}</span>
                Q${correct + wrong + skipped + 1}
            </div>
            <div class="vignette-text">${q.text}</div>
            <div class="vignette-lead">${q.lead}</div>
        </div>
    `;

    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    const letters = ['A','B','C','D'];
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
        btn.onclick = () => selectAnswer(i, btn);
        grid.appendChild(btn);
    });
}

function selectAnswer(index, btnEl) {
    if (answering || !gameActive) return;
    answering = true;
    const q = questions[qIndex];
    const isCorrect = index === q.correct;

    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach((b, i) => {
        b.disabled = true;
        if (i === q.correct) b.classList.add('correct');
        if (i === index && !isCorrect) b.classList.add('wrong');
    });

    if (isCorrect) {
        correct++;
        score += 10 + (streak * 2); // Bonus for streaks
        streak++;
        if (streak > bestStreak) bestStreak = streak;
        timeLeft = Math.min(timeLeft + 3, 99.9);
        showTimePopup('+3s', 'bonus');
        showFeedbackStripe('correct');
    } else {
        wrong++;
        streak = 0;
        timeLeft = Math.max(timeLeft - 5, 0);
        showTimePopup('−5s', 'penalty');
        showFeedbackStripe('wrong');
        if (timeLeft <= 0) { endGame(); return; }
    }

    updateHUD();
    qIndex++;
    setTimeout(() => {
        if (gameActive) showQuestion();
    }, 600);
}

function skipQuestion() {
    if (answering || !gameActive) return;
    skipped++;
    qIndex++;
    streak = 0;
    updateHUD();
    showQuestion();
}

function updateHUD() {
    document.getElementById('hudScore').textContent = score;
    document.getElementById('hudStreak').textContent = streak > 0 ? streak + '🔥' : '0';
}

function showTimePopup(text, type) {
    const el = document.createElement('div');
    el.className = 'time-popup ' + type;
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
}

function showFeedbackStripe(type) {
    const el = document.createElement('div');
    el.className = 'feedback-stripe ' + type;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
}

// ═══ RESULTS ═══
function showResults() {
    document.getElementById('gameScreen').classList.remove('active');
    const screen = document.getElementById('resultsScreen');
    screen.classList.add('active');

    const total = correct + wrong;
    const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
    const grade = score >= 200 ? '🏆' : score >= 120 ? '🔥' : score >= 60 ? '💪' : '📚';
    const title = score >= 200 ? 'Chief Resident Energy' : score >= 120 ? 'Attending Material' : score >= 60 ? 'Solid Intern' : 'Keep Grinding';
    const hs = parseInt(localStorage.getItem('triage_hs_' + mode) || '0');
    const isNewHS = score >= hs && score > 0;

    document.getElementById('resultsInner').innerHTML = `
        <div class="results-grade">${grade}</div>
        <div class="results-title">${title}${isNewHS ? ' — NEW BEST!' : ''}</div>
        <div class="results-subtitle">${correct} diagnosed, ${wrong} missed, ${skipped} skipped in 60 seconds</div>
        <div class="results-stats">
            <div class="result-stat-card">
                <div class="result-stat-val green">${score}</div>
                <div class="result-stat-label">Score</div>
            </div>
            <div class="result-stat-card">
                <div class="result-stat-val gold">${bestStreak}</div>
                <div class="result-stat-label">Best Streak</div>
            </div>
            <div class="result-stat-card">
                <div class="result-stat-val" style="color:var(--text)">${accuracy}%</div>
                <div class="result-stat-label">Accuracy</div>
            </div>
        </div>
        <div class="results-bar-chart">
            <div class="bar-chart-title">Performance Breakdown</div>
            <div class="bar-row">
                <div class="bar-label" style="color:var(--accent)">${correct}</div>
                <div class="bar-track"><div class="bar-fill green" style="width:0" id="barCorrect"></div></div>
            </div>
            <div class="bar-row">
                <div class="bar-label" style="color:var(--hot)">${wrong}</div>
                <div class="bar-track"><div class="bar-fill red" style="width:0" id="barWrong"></div></div>
            </div>
        </div>
        <button class="share-btn-triage" onclick="shareTriage()">Share Your Score ⚡</button>
        <button class="retry-btn" onclick="retryGame()">Play Again</button>
        <div class="cta-card">
            <div class="cta-card-title">Speed comes from deep understanding.</div>
            <div class="cta-card-text">USMLE300 bootcamps build the pattern recognition that turns 4-second guesses into confident diagnoses.</div>
            <a href="https://usmle300.com" target="_blank" class="cta-card-btn">Explore Bootcamps →</a>
        </div>
    `;

    // Animate bars
    const maxBar = Math.max(correct, wrong, 1);
    requestAnimationFrame(() => {
        setTimeout(() => {
            document.getElementById('barCorrect').style.width = (correct / maxBar * 100) + '%';
            document.getElementById('barWrong').style.width = (wrong / maxBar * 100) + '%';
        }, 100);
    });
}

function shareTriage() {
    const accuracy = (correct + wrong) > 0 ? Math.round((correct / (correct + wrong)) * 100) : 0;
    const text = `⚡ TRIAGE by USMLE300\n\nScore: ${score} | ${correct} correct | ${bestStreak} streak\nAccuracy: ${accuracy}%\n\nCan you beat my time?\nusmle300.com/triage`;
    if (navigator.share) {
        navigator.share({ text }).catch(() => copyText(text));
    } else {
        copyText(text);
    }
}

function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
    });
}

function retryGame() {
    document.getElementById('resultsScreen').classList.remove('active');
    document.getElementById('titleScreen').classList.add('active');
    updateHighScoreDisplay();
}
</script>
